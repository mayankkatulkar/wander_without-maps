name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Catches adapter-level breakage (bundling, Node API use that Workers
      # does not support) before it reaches a deploy on main.
      - name: Build for Cloudflare
        run: npx opennextjs-cloudflare build

      - name: Check every route still renders
        run: node scripts/smoke-test.mjs
